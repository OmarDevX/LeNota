[package]
name = "lenota-desktop"
version = "0.33.3"
description = "A local-first desktop and mobile note application"
authors = ["LeNota contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "lenota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-sync = { path = "../../../crates/app-sync" }
app-core = { path = "../../../crates/app-core" }
app-database = { path = "../../../crates/app-database" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "wry"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
mime_guess = "2"
uuid.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gtk = { version = "0.18.2", features = ["v3_24"] }
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.23"
