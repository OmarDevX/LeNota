[package]
name = "lenota-desktop"
version = "0.28.0"
description = "A local-first Linux note application"
authors = ["LeNota contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "lenota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../../../crates/app-core" }
app-database = { path = "../../../crates/app-database" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "wry"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
mime_guess = "2"
uuid.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }
